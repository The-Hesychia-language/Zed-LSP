name = "Hesychia"
grammar = "hesychia"
path_suffixes = ["hsy"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
# A line ending with `:` opens a block.
increase_indent_pattern = "^[^#]*:\\s*(#.*)?$"
decrease_indent_pattern = "^\\s*(elif|else|except|case)\\b.*:"
